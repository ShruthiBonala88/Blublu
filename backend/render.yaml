services:
  - type: web
    name: blublu-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blublu-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: blublu-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FAST2SMS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_PHONE
        sync: false

databases:
  - name: blublu-postgres
    plan: free
    databaseName: blublu
    user: blublu

  - name: blublu-redis
    type: redis
    plan: free
