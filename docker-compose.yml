services:

  postgres:
    image: postgis/postgis:17-3.5
    container_name: blublu-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: blublu
      POSTGRES_PASSWORD: blublu_dev_password
      POSTGRES_DB: blublu

    ports:
      - "5433:5432"

    volumes:
      - blublu_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: blublu-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - blublu_redis_data:/data

volumes:
  blublu_postgres_data:
  blublu_redis_data: